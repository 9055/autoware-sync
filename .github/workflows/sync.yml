name: Sync Autoware Image
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h

      - name: Login to source GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull ghcr.io/autowarefoundation/autoware:universe-devel-cuda-1.7.1

      - name: Push to target
        run: |
          docker tag ghcr.io/autowarefoundation/autoware:universe-devel-cuda-1.7.1 ghcr.io/9055/autoware-sync:latest
          docker push ghcr.io/9055/autoware-sync:latest
