name: Sync Autoware Image
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Copy image via skopeo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y skopeo
          skopeo copy \
            docker://ghcr.io/autowarefoundation/autoware:universe-devel-cuda-1.7.1 \
            docker://ghcr.io/9055/autoware-sync:latest
