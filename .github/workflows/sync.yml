name: Sync Autoware Image
on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null
          df -h /

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and push image
        run: |
          echo "拉取中..."
          docker pull ghcr.io/autowarefoundation/autoware:universe-devel-cuda-1.7.1
          echo "打标签..."
          docker tag ghcr.io/autowarefoundation/autoware:universe-devel-cuda-1.7.1 ghcr.io/9055/autoware-sync:latest
          echo "推送中..."
          docker push ghcr.io/9055/autoware-sync:latest
          echo "完成!"
